[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymordial-engine"
version = "0.1.0"
description = "A data-oriented, hybrid-tier 3D game engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "PyMordial Team" }
]
dependencies = [
    "pygame-ce>=2.5.0",
    "moderngl>=5.12.0",
    "numpy>=2.0.0",
    "zstandard>=0.23.0",
    "imgui-bundle>=1.92.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "maturin>=1.15.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
