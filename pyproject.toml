[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymordial-engine"
version = "0.1.0a1"
description = "A data-oriented, hybrid-tier 3D game engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PyMordial Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pygame-ce>=2.5.0",
    "moderngl>=5.12.0",
    "numpy>=2.0.0",
    "zstandard>=0.23.0",
    "imgui-bundle>=1.92.0",
    "pyopengl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "maturin>=1.15.0",
    "ruff>=0.5.0",
]

[project.scripts]
pymordial-cooker = "engine.assets.cooker:main"
pymordial-packager = "engine.tools.packager:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-dir]
"engine.shaders" = "shaders"

[tool.setuptools.package-data]
"engine" = ["py.typed"]
"engine.shaders" = ["*.*", "**/*.*", "*.vert", "*.frag", "*.comp", "*.tesc", "*.tese", "*.glsl", "common/*.glsl"]

[tool.pytest.ini_options]
testpaths = ["tests", "projects/shotgun_beat_the_speed/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
